# All experiment parameters are defined in this file, so a run is reproducible
# from the file and the code.

universe_size: 500          # largest US filers by SEC's market-cap ordering
start_date: "2015-01-01"    # first filing date to include
forms: ["10-K", "10-Q"]

llm:
  model: "llama3.1:8b"
  # 127.0.0.1 rather than localhost: on Windows, localhost can add about two
  # seconds to every request while the client first tries IPv6.
  host: "http://127.0.0.1:11434"
  training_cutoff: "2023-12-31"   # Meta's documented cutoff for Llama 3.1
  chunk_chars: 12000              # about 3,000 tokens of MD&A per call
  max_chunks: 3                   # first N chunks of each MD&A
  num_ctx: 8192
  workers: 4                      # concurrent requests to Ollama

backtest:
  entry_lag_days: 1         # trading days skipped after the filing date
  horizons: [5, 21, 63]     # event-study horizons, in trading days
  quantiles: 5
  max_signal_age_days: 100  # a filing's signal expires after this many days
  cost_bps: 10              # one-way trading cost
  benchmark: "SPY"
  primary_signal: "llm_score_chg"   # fixed before any results were computed

leakage:
  memory_pairs_per_year: 400   # random stock pairs per calendar year, each asked in both orders
  memory_horizon: 63           # trading days over which the two returns are compared
  identity_sample: 300         # filings drawn for the identity probe
  # Models given the memory probe, with the end of their training data as
  # documented in Meta's model cards. Models that are not installed are skipped.
  memory_models:
    "llama2:7b": "2022-09-30"      # pretraining data; some tuning data runs to July 2023
    "llama3:8b": "2023-03-31"
    "llama3.1:8b": "2023-12-31"

embed:
  model: "nomic-embed-text"
  host: "http://127.0.0.1:11434"
  prefix: "clustering: "      # nomic models expect a task prefix; this one is intended for symmetric similarity
  chunk_chars: 1500
  batch: 32
  workers: 2

demo:                         # precomputed Risk Factors comparisons for docs/index.html
  companies: 100              # the largest companies in the universe, every filing year
  max_items: 12               # paragraphs kept per section of each comparison
