[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsig"
version = "0.1.0"
description = "LLM-extracted signals from SEC filings, with a point-in-time backtest and leakage tests"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "pyarrow",
    "lxml",
    "yfinance",
    "curl_cffi>=0.15",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
